name: Build Android APK

on:
  push:
    branches: [ "arena/*", "main", "dev/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7
  EXPORT_NAME: "SonicSecretRingsRemake"
  PROJECT_PATH: "Project"

jobs:
  export-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download Godot .NET + Export Templates
        run: |
          # ─── Download Godot binary ──────────────────────────────
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64.zip"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64.zip"
          rm -f "Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64.zip"
          
          # Find the extracted binary (file or inside a subdirectory)
          GODOT_EXTRACTED=$(find . -maxdepth 2 -name "Godot*" ! -name "*.zip" ! -name "*.tpz" -type f 2>/dev/null | head -1)
          if [ -z "$GODOT_EXTRACTED" ]; then
            # Try without 'mono' in name (some variants)
            GODOT_EXTRACTED=$(find . -maxdepth 2 -name "godot*" ! -name "*.zip" ! -name "*.tpz" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$GODOT_EXTRACTED" ]; then
            echo "❌ Could not find Godot binary after extraction!"
            ls -la
            exit 1
          fi
          chmod +x "$GODOT_EXTRACTED"
          echo "GODOT_BIN=$(readlink -f "$GODOT_EXTRACTED")" >> "$GITHUB_ENV"
          echo "✅ Found Godot binary: $GODOT_EXTRACTED ($(du -h "$GODOT_EXTRACTED" | cut -f1))"
          
          # ─── Download and install export templates ─────────────
          # Godot 4.7 mono expects templates under "<version>.stable.mono"
          GODOT_TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono"
          mkdir -p "$GODOT_TEMPLATES_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d "$GODOT_TEMPLATES_DIR"
          rm -f templates.tpz
          if [ -d "$GODOT_TEMPLATES_DIR/templates" ]; then
            mv "$GODOT_TEMPLATES_DIR/templates/"* "$GODOT_TEMPLATES_DIR/"
            rmdir "$GODOT_TEMPLATES_DIR/templates"
          fi
          ls -la "$GODOT_TEMPLATES_DIR/" | head -5
          echo "✅ Export templates installed"

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore NuGet packages and build
        run: |
          cd "${{ env.PROJECT_PATH }}"
          dotnet restore
          dotnet build --configuration ExportRelease || dotnet build
          echo "✅ .NET build complete"

      - name: Configure Godot for Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << 'GDSETTINGS'
          [godot_resource type="EditorSettings" format=3]
          resource_name="editor_settings"
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "/home/runner/debug.p12"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamp = 0
          export/android/use_minizip = false
          GDSETTINGS
          echo "✅ Editor settings created"
          
          # STABLE debug signature: .ci/debug.p12 is committed in the repo so every
          # CI build is signed with the SAME certificate — new APKs install OVER the
          # existing app (no "app not installed", data/layout kept). Previously the
          # keystore was regenerated per run → Android refused updates → people kept
          # running stale builds without touch keys.
          if [ -f "$GITHUB_WORKSPACE/.ci/debug.p12" ]; then
            cp "$GITHUB_WORKSPACE/.ci/debug.p12" "$HOME/debug.p12"
            echo "✅ Stable debug keystore installed"
          else
            echo "⚠️ .ci/debug.p12 missing — Godot will self-generate (signature will change every build)"
          fi

      - name: Fetch boot videos (optional release assets)
        run: |
          # *.mp4 splash/cutscene videos are intentionally NOT in git (see .gitignore:
          # "Video files are too large to backup"). If they are published as assets of
          # a 'boot-videos' release, bake them into the APK; otherwise Boot.tscn falls
          # back to the static logo image (see VideoStreamFileLoadPlayer fallbackImagePath).
          mkdir -p "${{ env.PROJECT_PATH }}/video/boot"
          cd "${{ env.PROJECT_PATH }}/video/boot"
          if gh release download boot-videos --pattern "*.mp4" --clobber; then
            echo "✅ Boot videos fetched:"
            ls -la *.mp4
          else
            echo "ℹ️ No 'boot-videos' release found — splash will use static fallback logo"
          fi

      - name: Pre-heat Godot cache
        run: |
          cd "${{ env.PROJECT_PATH }}"
          "$GODOT_BIN" --headless --editor --quit --path . 2>&1
          echo "✅ Pre-heat done"

      - name: Debug - show templates and env
        run: |
          echo "GODOT_BIN=$GODOT_BIN"
          echo "HOME=$HOME"
          ls -la "$HOME/.local/share/godot/export_templates/" 2>&1
          ls -la "$HOME/.local/share/godot/export_templates/4.7.stable.mono/" 2>&1 | head -20
          "$GODOT_BIN" --version 2>&1

      - name: Touch overlay runtime self-test
        run: |
          set +e
          TT=/tmp/touch_selftest
          rm -rf "$TT"; mkdir -p "$TT/addons"
          cp -r "${{ env.PROJECT_PATH }}/addons/touch_controls" "$TT/addons/touch_controls"
          # Force the overlay on (desktop selftest host is neither mobile nor touch)
          sed -i 's/@export var force_enabled: bool = false/@export var force_enabled: bool = true/' "$TT/addons/touch_controls/TouchControlsManager.gd"
          # Also exercise the mobile-only perf manager path
          sed -i 's/if _is_mobile():/if true:/' "$TT/addons/touch_controls/TouchControlsManager.gd"
          sed -i 's/if not OS.has_feature("android") and not OS.has_feature("mobile"):/if false:/' "$TT/addons/touch_controls/MobilePerformanceManager.gd"
          {
            echo 'config_version=5'
            echo '[application]'
            echo 'config/name="TouchSelfTest"'
            echo 'run/main_scene="res://selftest.tscn"'
            echo '[autoload]'
            echo 'TouchControls="*res://addons/touch_controls/TouchControlsManager.gd"'
            echo '[input]'
            sed -n '/^\[input\]/,/^\[/p' "${{ env.PROJECT_PATH }}/project.godot" | sed '1d;$d'
          } > "$TT/project.godot"
          cat > "$TT/selftest.tscn" << 'SCTSCN'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://selftest.gd" id="1"]

          [node name="Root" type="Node"]
          script = ExtResource("1")
          SCTSCN
          cat > "$TT/selftest.gd" << 'SELFTEST'
          extends Node
          func _ready() -> void:
            await get_tree().process_frame
            await get_tree().process_frame
            await get_tree().process_frame
            var mgr := get_node_or_null("/root/TouchControls")
            if mgr == null:
              print("SELFTEST: FAIL autoload missing")
              get_tree().quit(1)
              return
            var keys: int = mgr.get("_buttons").size()
            var vp := get_viewport().get_visible_rect().size
            print("SELFTEST: overlay built keys=", keys, " vp=", vp)
            if keys == 0:
              print("SELFTEST: FAIL no keycaps created")
              get_tree().quit(1)
              return
            var ev := InputEventScreenTouch.new()
            ev.index = 0
            ev.pressed = true
            ev.position = Vector2(vp.x * 0.835, vp.y * 0.845)
            Input.parse_input_event(ev)
            await get_tree().process_frame
            var jump := Input.is_action_pressed("button_jump")
            print("SELFTEST: synthetic touch on jump key, action active=", jump)
            ev.pressed = false
            Input.parse_input_event(ev)
            await get_tree().process_frame
            var perf := mgr.get("_perf")
            if perf != null:
              print("SELFTEST: perf tier=", perf.get("device_tier"), " initialized=", perf.get("is_initialized"))
            var ok: bool = keys >= 5 and jump
            print("SELFTEST: RESULT=", "PASS" if ok else "FAIL")
            get_tree().quit(0 if ok else 2)
          SELFTEST
          # Warm the .godot folder so class_name/global classes resolve,
          # exactly like the exported build does via its compiled class cache
          timeout 300 "$GODOT_BIN" --headless --editor --quit --path "$TT" > /tmp/selftest_import.txt 2>&1
          timeout 180 "$GODOT_BIN" --headless --path "$TT" --quit-after 600 > /tmp/selftest_out.txt 2>&1
          CODE=$?
          [ $CODE -eq 124 ] && echo "SELFTEST TIMEOUT (124) — overlay never finished init"
          sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' /tmp/selftest_out.txt > /tmp/st.txt
          awk '{gsub(/%/, "%25"); printf "%s%%0A", $0}' /tmp/st.txt | cut -c1-40000 > /tmp/st_flat.txt
          n=0
          split -b 3800 -d -a 2 /tmp/st_flat.txt /tmp/st_chunk_
          for ch in /tmp/st_chunk_*; do n=$((n+1)); echo "::error title=SELFTEST_LOG_$n::$(cat "$ch")"; done
          echo "---- selftest output (filtered) ----"
          grep -E "SELFTEST|SCRIPT ERROR|Invalid call|MobilePerformance|Too many" /tmp/selftest_out.txt | head -40
          echo "--------------------------------------"
          if grep -q "SCRIPT ERROR" /tmp/selftest_out.txt; then
            MSG=$(grep -A4 "SCRIPT ERROR" /tmp/selftest_out.txt | head -30 | sed ':a;N;$!ba;s/\n/%0A/g;s/%/%25/g' | head -c 3400)
            echo "::error title=TOUCH_RUNTIME_SCRIPT_ERRORS::$MSG"
            exit 1
          fi
          if [ $CODE -ne 0 ]; then
            TAIL=$(tail -25 /tmp/selftest_out.txt | sed ':a;N;$!ba;s/\n/%0A/g;s/%/%25/g' | head -c 3400)
            echo "::error title=TOUCH_SELFTEST_EXIT_$CODE::$TAIL"
            exit 1
          fi
          echo "✅ Touch overlay runtime self-test passed"

      - name: Export Android APK (Debug)
        run: |
          APK_OUT="$PWD/export/android/${{ env.EXPORT_NAME }}.apk"
          mkdir -p "$(dirname "$APK_OUT")"
          set +e
          "$GODOT_BIN" \
            --headless \
            --path "${{ env.PROJECT_PATH }}" \
            --export-debug "Android" \
            "$APK_OUT" > export_log.txt 2>&1
          EXPORT_STATUS=$?
          set -e
          echo "GODOT_EXPORT_EXIT=$EXPORT_STATUS"
          echo "APK_OUT=$APK_OUT"
          if [ -f "$APK_OUT" ]; then
            echo "✅ APK exported successfully!"
            echo "APK size: $(du -h "$APK_OUT" | cut -f1)"
            exit 0
          else
            echo "❌ APK export failed (exit $EXPORT_STATUS). Full log:"
            tail -100 export_log.txt
            exit 1
          fi

      - name: Publish export log to ci-logs branch (debug)
        if: failure()
        run: |
          set +e  # never abort this diagnostic step; always emit annotations
          # ---------- 1. Gather diagnostics ----------
          LOG_SRC=""
          if [ -f export_log.txt ]; then LOG_SRC=export_log.txt
          elif [ -f "${{ env.PROJECT_PATH }}/export_log.txt" ]; then LOG_SRC="${{ env.PROJECT_PATH }}/export_log.txt"
          fi
          {
            echo "===== export log: $LOG_SRC ====="
            cat "$LOG_SRC" 2>/dev/null || echo "(no export log found)"
            echo ""
            echo "===== templates dir ====="
            ls -la "$HOME/.local/share/godot/export_templates/" 2>&1 || true
            ls -la "$HOME/.local/share/godot/export_templates/4.7.stable.mono/" 2>&1 | head -20 || true
            echo ""
            echo "===== git status ====="
            pwd; git status --short 2>&1 | head -20
            echo ""
            echo "===== godot version ====="
            "$GODOT_BIN" --version 2>&1 || true
            echo ""
            echo "===== dotnet ====="
            dotnet --version 2>&1 || true
            echo ""
            echo "===== android sdk ====="
            ls /usr/local/lib/android/sdk 2>&1 | head -20
            echo ""
            echo "===== editor settings ====="
            cat "$HOME/.config/godot/editor_settings-4.tres" 2>&1 || true
            echo ""
            echo "===== token permissions (repo api) ====="
            gh api "repos/${{ github.repository }}" --jq '.permissions' 2>&1 | head -5
          } > /tmp/ci_debug.txt
          wc -l /tmp/ci_debug.txt
          head -c 59000 /tmp/ci_debug.txt > /tmp/ci_debug_short.txt

          # ---------- 2. Step summary (visible on public run page) ----------
          {
            echo "## CI Debug run $GITHUB_RUN_ID"
            echo ""
            cat /tmp/ci_debug.txt
          } >> "$GITHUB_STEP_SUMMARY"

          # ---------- 3. Publish to orphan ci-logs branch (commit-tree, keeps workspace) ----------
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          export GIT_INDEX_FILE="/tmp/ci_index_${GITHUB_RUN_ID}"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          B1=$(git hash-object -w /tmp/ci_debug.txt)
          git update-index --add --cacheinfo "100644,$B1,ci-logs/ci_debug_${GITHUB_RUN_ID}.txt"
          if [ -n "$LOG_SRC" ]; then
            B2=$(git hash-object -w "$LOG_SRC")
            git update-index --add --cacheinfo "100644,$B2,ci-logs/export_log_${GITHUB_RUN_ID}.txt"
          fi
          TREE=$(git write-tree)
          echo "TREE=$TREE"
          git fetch origin ci-logs 2>&1 | tail -2 || true
          PARENT=""
          PARENT=$(git rev-parse --verify origin/ci-logs 2>/dev/null || echo "")
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "ci: debug run ${GITHUB_RUN_ID}")
          else
            COMMIT=$(git commit-tree "$TREE" -m "ci: debug run ${GITHUB_RUN_ID}")
          fi
          echo "COMMIT=$COMMIT"
          git push --force origin "$COMMIT:refs/heads/ci-logs" > /tmp/push_out.txt 2>&1
          echo "PUSH_EXIT=$?" >> /tmp/push_out.txt
          cat /tmp/push_out.txt | tail -20

          # ---------- 4. Commit comment attempt ----------
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -f "body=@/tmp/ci_debug_short.txt" \
            "repos/${{ github.repository }}/commits/$GITHUB_SHA/comments" > /tmp/comment_out.txt 2>&1
          echo "COMMENT_EXIT=$?" >> /tmp/comment_out.txt
          cat /tmp/comment_out.txt | tail -8

          # ---------- 5. Deliver logs as annotations (readable via checks API) ----------
          {
            echo ""
            echo "======== PUSH OUT ========"
            tail -20 /tmp/push_out.txt 2>/dev/null || true
            echo "======== COMMENT OUT ========"
            tail -8 /tmp/comment_out.txt 2>/dev/null || true
          } >> /tmp/ci_debug.txt
          publish_annotations() {
            # $1 = title, $2 = source file (raw text). Splits into ~3800-char annotations.
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' "$2" > /tmp/ann_raw_${1}.txt
            awk '{gsub(/%/, "%25"); printf "%s%%0A", $0}' /tmp/ann_raw_${1}.txt | cut -c1-60000 > /tmp/ann_full_${1}.txt
            split -b 3800 -d -a 2 /tmp/ann_full_${1}.txt /tmp/ann_chunk_${1}_
            idx=0
            for chunk in /tmp/ann_chunk_${1}_*; do
              idx=$((idx + 1))
              echo "::error title=${1}_${idx}::$(cat "$chunk")"
            done
          }
          publish_annotations CI_DIAG /tmp/ci_debug.txt
          if [ -n "$LOG_SRC" ]; then
            publish_annotations EXPORT_FULL_LOG "$LOG_SRC"
          fi

      - name: Upload export log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-export-log
          path: ${{ github.workspace }}/export_log.txt
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-android-debug
          path: export/android/*.apk
          if-no-files-found: error
          retention-days: 30
