name: FFmpeg GDExtension (Android)

# Builds the EIRTeam.FFmpeg GDExtension together with a LGPL FFmpeg for
# Android arm64-v8a and (optionally) commits the resulting binaries into
# Project/addons/ffmpeg/android/ so the regular "Android APK" workflow can
# pick them up.
#
# The desktop binaries shipped in Project/addons/ffmpeg were taken from the
# upstream EIRTeam.FFmpeg releases, but upstream does not publish Android
# builds, so we build them here.

on:
  workflow_dispatch:
    inputs:
      commit_to_repo:
        description: "Commit the built Android libraries to this branch"
        type: boolean
        default: true
      ffmpeg_ref:
        description: "FFmpeg git tag to build (must stay on the 6.x / avcodec 60 line)"
        type: string
        default: "n6.1.2"
      eirteam_ref:
        description: "EIRTeam.FFmpeg git ref to build"
        type: string
        default: "master"

permissions:
  contents: write

env:
  ANDROID_API_LEVEL: "24"
  # Must match godot-cpp's hardcoded NDK version (tools/android.py).
  NDK_VERSION: "23.2.8568313"
  ADDON_DIR: "Project/addons/ffmpeg/android"

jobs:
  build:
    name: Build FFmpeg + GDExtension (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout EIRTeam.FFmpeg
        uses: actions/checkout@v4
        with:
          repository: EIRTeam/EIRTeam.FFmpeg
          ref: ${{ inputs.eirteam_ref || 'master' }}
          path: eirteam-ffmpeg
          # Only godot-cpp is needed; ffmpeg-kit is not used by this workflow.
          submodules: false

      - name: Checkout godot-cpp submodule
        working-directory: eirteam-ffmpeg
        run: git submodule update --init --depth 1 gdextension_build/godot-cpp

      - name: Checkout FFmpeg
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: ${{ inputs.ffmpeg_ref || 'n6.1.2' }}
          path: ffmpeg-src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons==4.4.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make pkg-config
          scons --version

      - name: Configure & build FFmpeg (arm64-v8a, shared, LGPL)
        working-directory: ffmpeg-src
        run: |
          set -euxo pipefail

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          PREFIX="${GITHUB_WORKSPACE}/ffmpeg-android-arm64"
          API="${ANDROID_API_LEVEL}"

          ./configure \
            --prefix="${PREFIX}" \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --sysroot="${TOOLCHAIN}/sysroot" \
            --cc="${TOOLCHAIN}/bin/aarch64-linux-android${API}-clang" \
            --cxx="${TOOLCHAIN}/bin/aarch64-linux-android${API}-clang++" \
            --ar="${TOOLCHAIN}/bin/llvm-ar" \
            --nm="${TOOLCHAIN}/bin/llvm-nm" \
            --ranlib="${TOOLCHAIN}/bin/llvm-ranlib" \
            --strip="${TOOLCHAIN}/bin/llvm-strip" \
            --extra-cflags="-fPIC -O3" \
            --extra-ldflags="-Wl,-z,max-page-size=16384" \
            --enable-shared \
            --disable-static \
            --enable-pic \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-avdevice \
            --disable-postproc \
            --disable-network \
            --disable-encoders \
            --disable-muxers \
            --disable-devices \
            --disable-outdevs \
            --disable-indevs \
            --disable-filters \
            --enable-filter=scale,format,null,anull,aformat,aresample,atrim,trim \
            --disable-decoders \
            --enable-decoder=h264,hevc,mpeg4,vp8,vp9,av1,theora,mjpeg,png \
            --enable-decoder=aac,aac_latm,mp3,mp3float,vorbis,opus,flac,pcm_s16le,pcm_s16be,pcm_f32le \
            --disable-demuxers \
            --enable-demuxer=mov,matroska,ogg,mp3,aac,wav,flac,mpegts,avi,image2 \
            --disable-parsers \
            --enable-parser=h264,hevc,mpeg4video,vp8,vp9,av1,aac,aac_latm,mpegaudio,vorbis,opus,flac,mjpeg,png \
            --disable-protocols \
            --enable-protocol=file,pipe \
            --disable-bsfs \
            --enable-bsf=h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc,extract_extradata

          make -j"$(nproc)"
          make install

          ls -l "${PREFIX}/lib"
          # Android target installs unversioned SONAMEs (libavcodec.so etc.),
          # which is exactly what ffmpeg.gdextension expects.
          "${TOOLCHAIN}/bin/llvm-readelf" -d "${PREFIX}/lib/libavcodec.so" | grep -E "SONAME|NEEDED"

      - name: Patch godot-cpp build flags (16 KB pages, static libc++)
        working-directory: eirteam-ffmpeg/gdextension_build
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("SConstruct")
          s = p.read_text()
          marker = 'env.Append(CPPDEFINES=["GDEXTENSION"])'
          extra = (
              marker
              + "\n"
              + "if env[\"platform\"] == \"android\":\n"
              + "    env.Append(LINKFLAGS=[\"-Wl,-z,max-page-size=16384\", \"-static-libstdc++\"])\n"
          )
          if "max-page-size" not in s:
              s = s.replace(marker, extra, 1)
              p.write_text(s)
          print(s[s.find(marker) - 100 : s.find(marker) + 300])
          PY

      - name: Build GDExtension (template_release + template_debug)
        working-directory: eirteam-ffmpeg/gdextension_build
        env:
          FFMPEG_PATH: ${{ github.workspace }}/ffmpeg-android-arm64
        run: |
          set -euxo pipefail
          for target in template_release template_debug; do
            scons \
              platform=android \
              arch=arm64 \
              target="${target}" \
              android_api_level="${ANDROID_API_LEVEL}" \
              debug_symbols=no \
              ffmpeg_path="${FFMPEG_PATH}" \
              -j"$(nproc)"
          done
          ls -l build/addons/ffmpeg/android

      - name: Strip & collect binaries
        run: |
          set -euxo pipefail
          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          SRC="eirteam-ffmpeg/gdextension_build/build/addons/ffmpeg/android"
          OUT="${GITHUB_WORKSPACE}/${ADDON_DIR}"

          mkdir -p "${OUT}"
          for lib in avcodec avfilter avformat avutil swresample swscale; do
            cp "${SRC}/lib${lib}.so" "${OUT}/lib${lib}.so"
          done
          cp "${SRC}/libgdffmpeg.android.template_release.arm64.so" "${OUT}/"
          cp "${SRC}/libgdffmpeg.android.template_debug.arm64.so" "${OUT}/"

          "${TOOLCHAIN}/bin/llvm-strip" --strip-unneeded "${OUT}"/*.so

          # Sanity check: the extension must only depend on libs we ship or
          # that are part of Android / the Godot runtime.
          for so in "${OUT}"/*.so; do
            echo "== $(basename "$so")"
            "${TOOLCHAIN}/bin/llvm-readelf" -d "$so" | grep -E "NEEDED|SONAME" || true
            "${TOOLCHAIN}/bin/llvm-readelf" -lW "$so" | grep -E "LOAD" | awk '{print "  align", $NF}' | sort -u
          done
          ls -lh "${OUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-gdextension-android-arm64
          path: ${{ env.ADDON_DIR }}/*.so
          if-no-files-found: error

      - name: Commit binaries to branch
        if: ${{ inputs.commit_to_repo }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${ADDON_DIR}"
          if git diff --cached --quiet; then
            echo "Android FFmpeg binaries are already up to date."
            exit 0
          fi
          git commit -m "Add FFmpeg GDExtension Android arm64 binaries (FFmpeg ${{ inputs.ffmpeg_ref || 'n6.1.2' }})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
